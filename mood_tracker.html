<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mood Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5EDE9;
    --card:#FFFFFF;
    --text:#5B5049;
    --text-faint:#B8ABA2;
    --ring:#E4D6CC;

    --c-genial:#FBDD8B;
    --c-bien:#BFE3C4;
    --c-normal:#CFCBEF;
    --c-meh:#F5C9A3;
    --c-mal:#F1AFAF;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{height:100%;}

  body{
    font-family:'Quicksand', sans-serif;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    color:var(--text);
  }

  .card{
    width:100%;
    max-width:400px;
    background:var(--card);
    border-radius:26px;
    padding:28px 24px 24px;
    box-shadow:0 20px 45px -25px rgba(91,80,73,0.35);
  }

  .header{
    text-align:center;
    margin-bottom:22px;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--text-faint);
    font-weight:600;
  }

  .title{
    font-size:22px;
    font-weight:700;
    margin-top:4px;
  }

  .faces{
    display:flex;
    justify-content:space-between;
    gap:8px;
    margin-bottom:18px;
  }

  .face-btn{
    appearance:none;
    border:none;
    background:transparent;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    flex:1;
    padding:6px 2px;
    border-radius:16px;
    transition:transform 0.2s ease, background 0.2s ease;
  }

  .face-btn:hover{ transform:translateY(-2px); }
  .face-btn:focus-visible{ outline:2px solid var(--ring); outline-offset:2px; }
  .face-btn.active{ background:#FBF6F3; }

  .face-circle{
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s ease;
  }

  .face-btn.active .face-circle{
    transform:scale(1.12);
    box-shadow:0 6px 16px -6px rgba(91,80,73,0.4);
  }

  .face-label{
    font-size:11px;
    font-weight:600;
    color:var(--text-faint);
  }

  .face-btn.active .face-label{ color:var(--text); }

  .status{
    text-align:center;
    font-size:13.5px;
    color:var(--text-faint);
    min-height:18px;
    margin-bottom:6px;
  }

  .status strong{ color:var(--text); font-weight:700; }

  .divider{
    height:1px;
    background:var(--ring);
    margin:20px 0 16px;
    opacity:0.6;
  }

  .cal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }

  .cal-title{
    font-size:14px;
    font-weight:700;
    text-transform:capitalize;
  }

  .cal-nav{
    display:flex;
    gap:6px;
  }

  .nav-btn{
    appearance:none;
    border:none;
    background:var(--bg);
    width:26px;
    height:26px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--text);
    transition:background 0.2s ease, opacity 0.2s ease;
  }

  .nav-btn:hover{ background:var(--ring); }

  .nav-btn:disabled{
    opacity:0.3;
    cursor:default;
    background:var(--bg);
  }

  .nav-btn svg{ width:12px; height:12px; }

  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    margin-bottom:6px;
  }

  .weekday{
    text-align:center;
    font-size:10px;
    font-weight:700;
    color:var(--text-faint);
    letter-spacing:0.03em;
  }

  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    row-gap:8px;
  }

  .cal-cell{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  .cal-dot{
    width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:600;
    color:var(--text);
    border:1.5px solid transparent;
  }

  .cal-cell.empty .cal-dot{ visibility:hidden; }

  .cal-cell.no-entry .cal-dot{
    background:var(--bg);
    color:var(--text-faint);
  }

  .cal-cell.future .cal-dot{
    background:transparent;
    color:var(--ring);
  }

  .cal-cell.today .cal-dot{
    border-color:var(--text);
  }

  .cal-cell.has-entry .cal-dot{
    color:#5B5049;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="eyebrow">Hoy</div>
    <div class="title">¿Cómo te sientes?</div>
  </div>

  <div class="faces" id="faces"></div>

  <div class="status" id="status">Toca una carita para guardar tu día</div>

  <div class="divider"></div>

  <div class="cal-header">
    <button class="nav-btn" id="prevMonth" aria-label="Mes anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="cal-title" id="calTitle"></div>
    <button class="nav-btn" id="nextMonth" aria-label="Mes siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>

  <div class="weekday-row" id="weekdayRow"></div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<script>
(function(){
  const MOODS = [
    { key:'genial', label:'Genial', color:'var(--c-genial)', mouth:'M -9,4 Q 0,13 9,4' },
    { key:'bien',   label:'Bien',   color:'var(--c-bien)',   mouth:'M -8,5 Q 0,10 8,5' },
    { key:'normal', label:'Normal', color:'var(--c-normal)', mouth:'M -8,6 L 8,6' },
    { key:'meh',    label:'Meh',    color:'var(--c-meh)',    mouth:'M -8,8 Q 0,3 8,8' },
    { key:'mal',    label:'Mal',    color:'var(--c-mal)',    mouth:'M -9,10 Q 0,1 9,10' }
  ];

  const WEEKDAYS = ['L','M','X','J','V','S','D']; // semana empieza en lunes
  const MONTH_NAMES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const STORAGE_KEY = 'mood-tracker-caritas-v1';

  const facesEl = document.getElementById('faces');
  const statusEl = document.getElementById('status');
  const calTitleEl = document.getElementById('calTitle');
  const weekdayRowEl = document.getElementById('weekdayRow');
  const calGridEl = document.getElementById('calGrid');
  const prevBtn = document.getElementById('prevMonth');
  const nextBtn = document.getElementById('nextMonth');

  function toKey(y, m, d){
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function todayKey(){
    const t = new Date();
    return toKey(t.getFullYear(), t.getMonth(), t.getDate());
  }

  function loadLog(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){
      return window.__inMemoryLog || (window.__inMemoryLog = {});
    }
  }

  function saveLog(log){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
    }catch(e){
      window.__inMemoryLog = log;
    }
  }

  let log = loadLog();

  const now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth();

  function faceSVG(mood, size){
    return `
      <svg width="${size}" height="${size}" viewBox="-26 -26 52 52">
        <circle cx="0" cy="0" r="25" fill="${mood.color}"/>
        <circle cx="-8" cy="-6" r="2.6" fill="#5B5049"/>
        <circle cx="8" cy="-6" r="2.6" fill="#5B5049"/>
        <path d="${mood.mouth}" stroke="#5B5049" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </svg>
    `;
  }

  function renderFaces(activeKey){
    facesEl.innerHTML = '';
    MOODS.forEach(mood => {
      const btn = document.createElement('button');
      btn.className = 'face-btn' + (mood.key === activeKey ? ' active' : '');
      btn.innerHTML = `
        <div class="face-circle">${faceSVG(mood, 52)}</div>
        <div class="face-label">${mood.label}</div>
      `;
      btn.addEventListener('click', () => {
        log[todayKey()] = mood.key;
        saveLog(log);
        renderFaces(mood.key);
        statusEl.innerHTML = `Guardado como <strong>${mood.label}</strong> hoy`;
        renderCalendar();
      });
      facesEl.appendChild(btn);
    });
  }

  function renderWeekdayRow(){
    weekdayRowEl.innerHTML = '';
    WEEKDAYS.forEach(w => {
      const el = document.createElement('div');
      el.className = 'weekday';
      el.textContent = w;
      weekdayRowEl.appendChild(el);
    });
  }

  function renderCalendar(){
    calTitleEl.textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

    const isCurrentMonth = (viewYear === now.getFullYear() && viewMonth === now.getMonth());
    nextBtn.disabled = isCurrentMonth;

    calGridEl.innerHTML = '';

    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    // JS getDay(): 0=domingo..6=sábado -> convertir a semana que empieza en lunes
    const jsDay = firstOfMonth.getDay();
    const leadingBlanks = (jsDay === 0) ? 6 : jsDay - 1;

    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    for(let i = 0; i < leadingBlanks; i++){
      const cell = document.createElement('div');
      cell.className = 'cal-cell empty';
      cell.innerHTML = '<div class="cal-dot"></div>';
      calGridEl.appendChild(cell);
    }

    const todaysKey = todayKey();

    for(let d = 1; d <= daysInMonth; d++){
      const key = toKey(viewYear, viewMonth, d);
      const moodKey = log[key];
      const mood = MOODS.find(m => m.key === moodKey);
      const cellDate = new Date(viewYear, viewMonth, d);
      const isFuture = cellDate > now && key !== todaysKey;
      const isToday = key === todaysKey;

      const cell = document.createElement('div');
      cell.className = 'cal-cell' +
        (isToday ? ' today' : '') +
        (mood ? ' has-entry' : (isFuture ? ' future' : ' no-entry'));

      const dot = document.createElement('div');
      dot.className = 'cal-dot';
      dot.textContent = d;
      if(mood){
        dot.style.background = mood.color;
      }

      cell.appendChild(dot);
      calGridEl.appendChild(cell);
    }
  }

  prevBtn.addEventListener('click', () => {
    viewMonth -= 1;
    if(viewMonth < 0){ viewMonth = 11; viewYear -= 1; }
    renderCalendar();
  });

  nextBtn.addEventListener('click', () => {
    if(nextBtn.disabled) return;
    viewMonth += 1;
    if(viewMonth > 11){ viewMonth = 0; viewYear += 1; }
    renderCalendar();
  });

  function init(){
    const savedKey = log[todayKey()];
    renderFaces(savedKey || null);
    if(savedKey){
      const mood = MOODS.find(m => m.key === savedKey);
      statusEl.innerHTML = `Guardado como <strong>${mood.label}</strong> hoy`;
    }
    renderWeekdayRow();
    renderCalendar();
  }

  init();
})();
</script>

</body>
</html>
