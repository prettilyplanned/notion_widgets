<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>clock ✧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5EDE9;
    --gold:#B99566;
    --taupe:#7C645C;
    --taupe-soft:#A5897F;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    width:100%;
    background:transparent;
    font-family:'Manrope', sans-serif;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    transform-origin:top center;
    animation:sway 5.5s ease-in-out infinite;
  }

  @keyframes sway{
    0%,100%{ transform:rotate(-1.5deg); }
    50%{ transform:rotate(1.5deg); }
  }

  /* cordón */
  .string{
    width:3px;
    height:32px;
    background:linear-gradient(var(--gold), transparent);
    opacity:0.55;
  }

  .tag{
    position:relative;
    width:min(80vw, 320px);
    background:var(--cream);
    border:1px solid rgba(185, 149, 102, 0.45);
    border-radius:22px 22px 28px 28px;
    padding:32px 26px 24px;
    text-align:center;
    box-shadow:0 14px 34px -16px rgba(124, 100, 92, 0.35);
  }

  /* agujerito de la tag: transparente, deja ver lo que hay detrás */
  .hole{
    position:absolute;
    top:-11px;
    left:50%;
    transform:translateX(-50%);
    width:20px;
    height:20px;
    border-radius:50%;
    background:transparent;
    border:1px solid rgba(185, 149, 102, 0.5);
    box-shadow:inset 0 2px 4px rgba(124, 100, 92, 0.15);
  }

  /* bloque interno: saludo y hora comparten el mismo margen izquierdo,
     y el bloque en sí queda centrado dentro de la tag */
  .content{
    display:inline-block;
    text-align:center;
  }

  .label{
    font-size:13px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--taupe-soft);
    font-weight:500;
    margin-bottom:4px;
  }

  .time{
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-size:clamp(3rem, 13vw, 3.8rem);
    color:var(--taupe);
    line-height:1.05;
    font-variant-numeric:tabular-nums;
    position:relative;
    top:5px;
  }

  .time .colon{
    color:var(--gold);
    animation:blink 2s ease-in-out infinite;
  }

  @keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:0.3; }
  }

  .divider{
    width:40px;
    height:1px;
    background:rgba(185, 149, 102, 0.5);
    margin:12px auto;
  }

  .date{
    font-size:14px;
    letter-spacing:0.05em;
    color:var(--taupe-soft);
    font-weight:400;
    text-transform:capitalize;
  }

  @media (prefers-reduced-motion: reduce){
    .wrap{ animation:none; }
    .time .colon{ animation:none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="string"></div>
  <div class="tag">
    <div class="hole"></div>
    <div class="content">
      <p class="label" id="greeting">good morning</p>
      <div class="time">
        <span id="hours">09</span><span class="colon">:</span><span id="minutes">32</span>
      </div>
    </div>
    <div class="divider"></div>
    <p class="date" id="date">Friday, August 29</p>
  </div>
</div>

<script>
  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const dateEl = document.getElementById('date');
  const greetingEl = document.getElementById('greeting');

  const dias = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const meses = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function actualizarReloj(){
    const ahora = new Date();
    const h = ahora.getHours();
    const m = ahora.getMinutes();

    hoursEl.textContent = String(h).padStart(2, '0');
    minutesEl.textContent = String(m).padStart(2, '0');

    dateEl.textContent = `${dias[ahora.getDay()]}, ${meses[ahora.getMonth()]} ${ahora.getDate()}`;

    let saludo = 'good evening';
    if (h >= 5 && h < 12) saludo = 'good morning';
    else if (h >= 12 && h < 19) saludo = 'good afternoon';
    greetingEl.textContent = saludo;
  }

  actualizarReloj();
  setInterval(actualizarReloj, 1000);
</script>

</body>
</html>
