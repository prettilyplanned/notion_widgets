<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greetings widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root {
        --accent: #F5EDE9;
        --ink: #6C4D38;
        --stage: #FFFFFF;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }

    body {
        margin: 0;
        padding: 24px 12px;
        background: var(--stage);
        font-family: Lora, "Times New Roman", Times, YuMincho, "Yu Mincho", "Hiragino Mincho ProN",
                     "Noto Serif CJK JP", "Nanum Myeongjo", "Songti SC", serif;
        text-transform: uppercase;
        font-variant-numeric: lining-nums tabular-nums;
        color: var(--ink);
    }

    .widget {
        padding: 14px 10px;
        color: var(--ink);
        background: #FFFFFF;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        max-width: 95%;
        margin: auto;
        border: 2px solid var(--ink);
        border-radius: 8px;
        box-shadow: 3px 3px 0 0 var(--ink);
    }

    .greet { font-size: calc(3em - 8pt); text-align: center; }
    .date  { font-size: calc(2em - 8pt); text-align: center; }
    .clock { font-size: calc(2em - 8pt); display: flex; align-items: baseline; }
    .time  { display: inline-block; min-width: 20px; text-align: center; }
    .colon { display: inline-block; }

    @media (max-width: 480px) {
        .greet { font-size: calc(2.2em - 6pt); }
        .date, .clock { font-size: calc(1.5em - 8pt); }
    }
</style>
</head>
<body>

<div class="container">
    <div class="widget">
        <div class="greet" id="greet"></div>
        <div class="date" id="date"></div>
        <div class="clock">
            <div class="time" id="hour"></div>
            <div class="colon">:</div>
            <div class="time" id="min"></div>
            <div class="colon">:</div>
            <div class="time" id="sec"></div>
        </div>
    </div>
</div>

<script>
    function displayGreetings(today) {
        const hrs = today.getHours();
        const name = ""; // pon aquí tu nombre si quieres
        let greet;
        if (hrs < 12) greet = 'Good Morning ' + name;
        else if (hrs < 18) greet = 'Good Afternoon ' + name;
        else greet = 'Good Evening ' + name;
        document.getElementById('greet').innerHTML = greet;
    }

    function displayDate(today) {
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const monthNames = ["January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"];
        document.getElementById('date').innerHTML =
            days[today.getDay()] + ", " + monthNames[today.getMonth()] + " " +
            today.getDate() + " " + today.getFullYear();
    }

    function displayClock(today) {
        const hour = padZeros(twelveHour(today.getHours()));
        const minutes = padZeros(today.getMinutes());
        let seconds = padZeros(today.getSeconds());
        seconds += today.getHours() >= 12 ? " pm" : " am";
        document.getElementById('hour').innerHTML = hour;
        document.getElementById('min').innerHTML = minutes;
        document.getElementById('sec').innerHTML = seconds;
    }

    function twelveHour(hour) {
        if (hour > 12) return hour - 12;
        if (hour === 0) return 12;
        return hour;
    }

    function padZeros(num) { return num < 10 ? '0' + num : num; }

    function displayWidget() {
        const today = new Date();
        displayGreetings(today);
        displayDate(today);
        displayClock(today);
        setTimeout(displayWidget, 500);
    }

    displayWidget();
</script>

</body>
</html>
